definitions:
  ios_env: &ios_env
    node: 22
    xcode: latest
    cocoapods: default
    groups:
      # Grupo de variables en Codemagic > Teams > Environment variables.
      # Debe contener APP_STORE_APPLE_ID (el "Apple ID" numerico de la app en
      # App Store Connect). No lleva secretos: la firma va por integracion.
      - somnus_ios
    ios_signing:
      distribution_type: app_store
      bundle_identifier: live.somnus.app
    vars:
      BUNDLE_ID: "live.somnus.app"
      # Capacitor 8 (SPM) genera App.xcodeproj, no App.xcworkspace.
      XCODE_PROJECT: "ios/App/App.xcodeproj"
      XCODE_SCHEME: "App"
      IOS_DEPLOYMENT_TARGET: "15.0"

workflows:
  ios-release:
    name: Somnus iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *ios_env
    integrations:
      # Nombre de la App Store Connect API key subida en Codemagic.
      app_store_connect: somnus_asc_key
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Instalar dependencias JS
        script: npm ci

      - name: Generar y sincronizar proyecto iOS
        script: |
          # El proyecto Xcode no se versiona: se genera aqui en cada build.
          # Capacitor 8 usa SPM por defecto (App.xcodeproj, sin xcworkspace).
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          test -d ios/App/App.xcodeproj
          ls -la ios/App

      - name: Aplicar overlay de ios-config/
        script: bash scripts/ios-postadd.sh

      - name: Generar iconos y splash
        script: npx capacitor-assets generate --ios --assetPath ios-config/assets

      - name: Calcular numero de build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          # Subshell: en Codemagic el cwd persiste entre scripts.
          (cd ios/App && agvtool new-version -all "$NEXT")

      - name: Descargar provisioning profiles
        script: |
          (cd ios/App && xcode-project use-profiles)
          bash scripts/ios-align-entitlements.sh

      - name: Compilar IPA
        script: |
          set -euo pipefail
          PROJECT="${CM_BUILD_DIR:-$PWD}/ios/App/App.xcodeproj"
          WORKSPACE="${CM_BUILD_DIR:-$PWD}/ios/App/App.xcworkspace"
          # Capacitor 8 + Stripe van por SPM. Sin destination, y con
          # CODE_SIGN_IDENTITY global, Xcode intenta firmar los paquetes y
          # el archive sale 65. CODE_SIGNING_ALLOWED=NO aplica al archive;
          # exportArchive (Codemagic) firma el IPA.
          ARCHIVE_FLAGS="-destination generic/platform=iOS CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=NO"
          dump_xcode_log() {
            local log
            log="$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$log" ]; then
              echo "==== xcodebuild errors ===="
              grep -E "error:|fatal error:|Provisioning profile|entitlement|CodeSign|does not support|FAILED" "$log" | tail -n 80 || true
              echo "==== last 80 lines of $log ===="
              tail -n 80 "$log"
            fi
          }
          trap dump_xcode_log ERR
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          xcodebuild -project "$PROJECT" -scheme "$XCODE_SCHEME" \
            -destination generic/platform=iOS \
            -resolvePackageDependencies
          if [ -d "$WORKSPACE" ]; then
            xcode-project build-ipa \
              --workspace "$WORKSPACE" \
              --scheme "$XCODE_SCHEME" \
              --disable-xcpretty \
              --archive-flags "$ARCHIVE_FLAGS"
          elif [ -d "$PROJECT" ]; then
            xcode-project build-ipa \
              --project "$PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --disable-xcpretty \
              --archive-flags "$ARCHIVE_FLAGS"
          else
            echo "ERROR: no hay App.xcodeproj ni App.xcworkspace en ios/App" >&2
            ls -la ios/App || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Somnus Internos
