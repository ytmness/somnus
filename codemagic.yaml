definitions:
  ios_env: &ios_env
    node: 20
    xcode: latest
    cocoapods: default
    groups:
      # Grupo de variables en Codemagic > Teams > Environment variables.
      # Debe contener APP_STORE_APPLE_ID (el "Apple ID" numerico de la app en
      # App Store Connect). No lleva secretos: la firma va por integracion.
      - somnus_ios
    ios_signing:
      distribution_type: app_store
      bundle_identifier: live.somnus.app
    vars:
      BUNDLE_ID: "live.somnus.app"
      XCODE_WORKSPACE: "ios/App/App.xcworkspace"
      XCODE_SCHEME: "App"
      IOS_DEPLOYMENT_TARGET: "15.0"

workflows:
  ios-release:
    name: Somnus iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *ios_env
    integrations:
      # Nombre de la App Store Connect API key subida en Codemagic.
      app_store_connect: somnus_asc_key
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Instalar dependencias JS
        script: npm ci

      - name: Generar y sincronizar proyecto iOS
        script: |
          # El proyecto Xcode no se versiona: se genera aqui en cada build.
          # Ver ios-config/ para la configuracion que si vive en el repo.
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Aplicar overlay de ios-config/
        script: bash scripts/ios-postadd.sh

      - name: Generar iconos y splash
        script: npx capacitor-assets generate --ios --assetPath ios-config/assets

      - name: Calcular numero de build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"

      - name: Descargar provisioning profiles
        script: xcode-project use-profiles

      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Somnus Internos
