# /etc/nginx/sites-available/somnus
# Fotos de perfil/eventos suelen pesar 2–5 MB; el default de nginx (1 MB) las rechaza con 413.

server {
    server_name somnus.live www.somnus.live;

    client_max_body_size 20m;

    access_log /var/log/nginx/somnus-access.log;
    error_log /var/log/nginx/somnus-error.log;

    location /uploads/ {
        alias /var/www/somnus/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/somnus.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/somnus.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.somnus.live) {
        return 301 https://$host$request_uri;
    }

    if ($host = somnus.live) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name somnus.live www.somnus.live;
    return 404;
}
